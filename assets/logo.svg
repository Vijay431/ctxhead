<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ctxhead</title>
  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="#30363d" stroke-width="4"/>

  <!-- Terminal / file glyph -->
  <rect x="80" y="64" width="352" height="308" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- Window title bar -->
  <line x1="80" y1="110" x2="432" y2="110" stroke="#30363d" stroke-width="2"/>
  <circle cx="108" cy="87" r="6" fill="#30363d"/>
  <circle cx="128" cy="87" r="6" fill="#30363d"/>
  <circle cx="148" cy="87" r="6" fill="#30363d"/>
  <text x="256" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">~15 lines</text>

  <!-- Highlighted header block (frontmatter header) -->
  <rect x="106" y="130" width="300" height="96" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Three small lines in green/cyan -->
  <rect x="126" y="148" width="160" height="8" rx="4" fill="#3fb950"/>
  <rect x="126" y="168" width="260" height="8" rx="4" fill="#58a6ff"/>
  <rect x="126" y="188" width="200" height="8" rx="4" fill="#58a6ff" fill-opacity="0.8"/>

  <!-- Frontmatter boundary divider -->
  <line x1="106" y1="244" x2="406" y2="244" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Dimmer body lines -->
  <rect x="106" y="262" width="270" height="7" rx="3.5" fill="#30363d"/>
  <rect x="106" y="280" width="230" height="7" rx="3.5" fill="#30363d" fill-opacity="0.75"/>
  <rect x="106" y="298" width="250" height="7" rx="3.5" fill="#30363d" fill-opacity="0.55"/>
  <rect x="106" y="316" width="190" height="7" rx="3.5" fill="#30363d" fill-opacity="0.4"/>
  <rect x="106" y="334" width="220" height="7" rx="3.5" fill="#30363d" fill-opacity="0.25"/>

  <!-- Wordmark -->
  <text x="256" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="1"><tspan fill="#3fb950">&gt;_ </tspan>ctxhead</text>
</svg>
