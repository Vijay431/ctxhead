<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <title>ctxhead</title>
  <!-- Background -->
  <rect width="1280" height="320" fill="#0d1117"/>
  <rect x="1" y="1" width="1278" height="318" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Logo motif on the left -->
  <g transform="translate(80, 50)">
    <!-- Terminal window container -->
    <rect width="176" height="220" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="176" y2="36" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="4" fill="#30363d"/>
    <circle cx="32" cy="18" r="4" fill="#30363d"/>
    <circle cx="46" cy="18" r="4" fill="#30363d"/>

    <!-- Highlighted header block -->
    <rect x="14" y="48" width="148" height="66" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Three small lines in green/cyan -->
    <rect x="24" y="60" width="85" height="5" rx="2.5" fill="#3fb950"/>
    <rect x="24" y="73" width="128" height="5" rx="2.5" fill="#58a6ff"/>
    <rect x="24" y="86" width="96" height="5" rx="2.5" fill="#58a6ff" fill-opacity="0.8"/>

    <!-- Divider -->
    <line x1="14" y1="124" x2="162" y2="124" stroke="#30363d" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Dimmer body lines -->
    <rect x="24" y="136" width="128" height="4.5" rx="2.25" fill="#30363d"/>
    <rect x="24" y="148" width="108" height="4.5" rx="2.25" fill="#30363d" fill-opacity="0.75"/>
    <rect x="24" y="160" width="118" height="4.5" rx="2.25" fill="#30363d" fill-opacity="0.55"/>
    <rect x="24" y="172" width="78" height="4.5" rx="2.25" fill="#30363d" fill-opacity="0.35"/>
    <rect x="24" y="184" width="98" height="4.5" rx="2.25" fill="#30363d" fill-opacity="0.2"/>
  </g>

  <!-- Typography -->
  <text x="300" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="-0.5"><tspan fill="#3fb950">&gt;_ </tspan>ctxhead</text>
  <text x="304" y="184" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#8b949e">Headers that let AI agents read 15 lines, not the whole file</text>

  <!-- Feature pill chips -->
  <g transform="translate(304, 218)">
    <rect x="0" y="0" width="164" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#3fb950"/>
    <text x="28" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="500">~15 lines / file</text>

    <rect x="176" y="0" width="140" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="192" cy="16" r="4" fill="#58a6ff"/>
    <text x="204" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="500">token-saver</text>

    <rect x="328" y="0" width="152" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="344" cy="16" r="4" fill="#d29922"/>
    <text x="356" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="500">agent-friendly</text>
  </g>

  <!-- Frontmatter preview card on right -->
  <g transform="translate(930, 50)">
    <rect width="270" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#30363d"/>
    <circle cx="28" cy="17" r="3.5" fill="#30363d"/>
    <circle cx="40" cy="17" r="3.5" fill="#30363d"/>
    <text x="254" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">auth-middleware.ts</text>

    <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">// ---</text>
    <text x="18" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><tspan fill="#8b949e">// </tspan><tspan fill="#58a6ff">name</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#3fb950">auth-middleware</tspan></text>
    <text x="18" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><tspan fill="#8b949e">// </tspan><tspan fill="#58a6ff">description</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#3fb950">Verifies JWTs.</tspan></text>
    <text x="18" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"><tspan fill="#8b949e">// </tspan><tspan fill="#58a6ff">ctxhead</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#d29922">v1 sha256:b40dedde…</tspan></text>
    <text x="18" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">// ---</text>
    <text x="18" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e" fill-opacity="0.6">// body below, skipped by agents</text>
    <text x="18" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#30363d">export function authMiddleware() {</text>
  </g>
</svg>
