name: Bug report
description: Report a reproducible problem with ctxhead
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, do not use this form. Use the private advisory link in SECURITY.md instead.
  - type: input
    id: ctxhead-version
    attributes:
      label: ctxhead version
      description: Output of `ctxhead --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agent(s) involved
      description: Which AI agent install target was involved, if any
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Antigravity
        - None
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the problem
      placeholder: |
        1. Run `ctxhead ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant terminal output or error messages. Paste inside a code block.
      render: shell
    validations:
      required: false
